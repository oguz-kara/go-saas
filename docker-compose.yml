version: "3.9"

services:
  web-admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: dolucrm-web-admin
    env_file:
      - ./web-admin/.env
    depends_on:
      - api
    networks:
      - dolucrm-network
    restart: unless-stopped
    ports:
      - "3000:3000"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: dolucrm-api
    command: >
      sh -c "npx prisma migrate deploy && node dist/main"
    env_file:
      - ./api/.env
    depends_on:
      - db
    networks:
      - dolucrm-network
    restart: always
    ports:
      - "5000:3000"

  db:
    image: postgres:16-alpine
    container_name: dolucrm-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dolucrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-dolucrm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - dolucrm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dolucrm}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
    driver: local

networks:
  dolucrm-network:
    name: dolucrm-network
    driver: bridge
